name: Deploy data platform

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente de destino
        required: true
        type: choice
        options:
          - dev
          - hom
          - prod
        default: dev
      image_tag:
        description: Tag da imagem já publicada (opcional; padrão é o commit atual)
        required: false
        type: string
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: botbrewpub-ghsurp
  REGION: us-central1
  REPOSITORY: data-platform
  IMAGE_NAME: ingestion

jobs:
  deploy:
    name: Deploy ${{ github.event.inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Define deployment parameters
        id: config
        shell: bash
        run: |
          TARGET_ENV="${{ github.event.inputs.environment || 'dev' }}"
          IMAGE_TAG_INPUT="${{ github.event.inputs.image_tag }}"

          if [[ -n "$IMAGE_TAG_INPUT" ]]; then
            IMAGE_TAG="$IMAGE_TAG_INPUT"
          else
            IMAGE_TAG="sha-${GITHUB_SHA}"
          fi

          IMAGE_URI="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}"

          echo "environment=$TARGET_ENV" >> "$GITHUB_OUTPUT"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/756989253873/locations/global/workloadIdentityPools/github-actions/providers/github-oidc
          service_account: sa-github-actions@botbrewpub-ghsurp.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker "${{ env.REGION }}-docker.pkg.dev" --quiet

      - name: Build and publish image once
        shell: bash
        run: |
          IMAGE="${{ steps.config.outputs.image_uri }}:${{ steps.config.outputs.image_tag }}"

          if gcloud artifacts docker images describe "$IMAGE" \
            --project="${{ env.PROJECT_ID }}" \
            --format='value(image_summary.digest)' >/dev/null 2>&1; then
            echo "Image already exists. Reusing immutable artifact: $IMAGE"
            exit 0
          fi

          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "Image $IMAGE does not exist. Manual deployments only promote existing images."
            echo "Run the build through a push to main first."
            exit 1
          fi

          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Resolve immutable image digest
        id: image
        shell: bash
        run: |
          IMAGE="${{ steps.config.outputs.image_uri }}:${{ steps.config.outputs.image_tag }}"
          DIGEST="$(gcloud artifacts docker images describe "$IMAGE" \
            --project="${{ env.PROJECT_ID }}" \
            --format='value(image_summary.digest)')"

          test -n "$DIGEST"
          echo "image=${{ steps.config.outputs.image_uri }}@$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Update Cloud Run ingestion job
        run: |
          ENVIRONMENT="${{ steps.config.outputs.environment }}"
          gcloud run jobs update "ingestion-${ENVIRONMENT}" \
            --image="${{ steps.image.outputs.image }}" \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}"

      - name: Deploy orchestration workflow
        run: |
          ENVIRONMENT="${{ steps.config.outputs.environment }}"
          gcloud workflows deploy "orchestrator-${ENVIRONMENT}" \
            --source="orchestration/workflows/ingestion-${ENVIRONMENT}.yaml" \
            --location="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --service-account="sa-orchestrator-${ENVIRONMENT}@${{ env.PROJECT_ID }}.iam.gserviceaccount.com"

      - name: Deployment summary
        run: |
          echo "Environment: ${{ steps.config.outputs.environment }}"
          echo "Image tag: ${{ steps.config.outputs.image_tag }}"
          echo "Image deployed: ${{ steps.image.outputs.image }}"
          echo "Workflow: orchestrator-${{ steps.config.outputs.environment }}"
